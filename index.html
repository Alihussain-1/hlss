<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .controls {
      width: 100%;
      max-width: 900px;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input::placeholder {
      color: #666;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    .player {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .note {
      margin-top: 16px;
      color: #888;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Mediadelivery Player</h1>
  <div class="controls">
    <input 
      type="text" 
      id="urlInput" 
      placeholder="Paste iframe.mediadelivery.net link here..."
      spellcheck="false"
    >
    <button onclick="loadVideo()">Play</button>
  </div>
  <div class="player">
    <iframe id="player" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
  </div>
  <p class="note">Paste the full embed URL and click Play</p>
  <script>
    function loadVideo() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) {
        alert('Please paste a link first');
        return;
      }
      document.getElementById('player').src = url;
    }
    // Also play when pressing Enter
    document.getElementById('urlInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        loadVideo();
      }
    });
  </script>
</body>
</html>
